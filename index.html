<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffr</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chiffr</h1>

        <div class="loading" id="loading">
            <p>Chargement...</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <div class="content" id="content" style="display: none;">
            <!-- Onglets principaux -->
            <div class="tabs">
                <button class="tab-button active" data-tab="keys">🔑 Gestion des clés</button>
                <button class="tab-button" data-tab="encrypt">🔒 Chiffrement</button>
                <button class="tab-button" data-tab="decrypt">🔓 Déchiffrement</button>
            </div>

            <!-- Onglet Gestion des clés -->
            <div class="tab-content active" id="keys-tab">
                <!-- Sous-onglets pour la gestion des clés -->
                <div class="sub-tabs">
                    <button class="sub-tab-button active" data-sub-tab="load-keys">Chargement des clés</button>
                    <button class="sub-tab-button" data-sub-tab="create-rsa">Création de paire RSA</button>
                </div>

                <!-- Sous-onglet Chargement des clés -->
                <div class="sub-tab-content active" id="load-keys-subtab">
                    <div class="section">
                        <h3>Mes clés</h3>
                        <div class="my-keys-section">
                            <div class="key-status">
                                <div class="key-status-item">
                                    <span>Clé publique : </span>
                                    <span id="public-key-status">❌ Non chargée</span>
                                </div>
                                <div class="key-status-item">
                                    <span>Clé privée : </span>
                                    <span id="private-key-status">❌ Non chargée</span>
                                </div>
                            </div>
                            <div class="key-buttons">
                                <button id="load-my-public-key-btn">Charger clé publique</button>
                                <button id="load-my-private-key-btn">Charger clé privée</button>
                                <button id="clear-keys-btn" class="primary-btn">Effacer mes clés</button>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h3>Clé publique de l'interlocuteur</h3>
                        <div class="interlocutor-key-section">
                            <div class="key-status-item">
                                <span>Clé publique interlocuteur : </span>
                                <span id="interlocutor-key-status">❌ Non chargée</span>
                            </div>
                            <button id="load-interlocutor-key-btn" class="primary-btn">Charger clé publique de l'interlocuteur</button>
                        </div>
                    </div>
                </div>

                <!-- Sous-onglet Création de paire RSA -->
                <div class="sub-tab-content" id="create-rsa-subtab">
                    <div class="section">
                        <h3>Générer une nouvelle paire de clés RSA</h3>
                        <div class="create-rsa-section">
                            <div class="key-prefix-input">
                                <input type="text" id="key-prefix" placeholder="Préfixe des clés (ex: mon_nom)" />
                            </div>
                            <button id="generate-rsa-keys-btn" class="primary-btn">Générer paire RSA</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Onglet Chiffrement -->
            <div class="tab-content" id="encrypt-tab">
                <div class="section">
                    <textarea id="encrypt-input" rows="8" placeholder="Texte à chiffrer" spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <button id="encrypt-btn" class="primary-btn">Chiffrer le message</button>
                </div>

                <div class="section">
                    <textarea id="encrypt-output" rows="8" readonly placeholder="Message chiffré (à envoyer)"></textarea>
                </div>
            </div>

            <!-- Onglet Déchiffrement -->
            <div class="tab-content" id="decrypt-tab">
                <div class="section">
                    <textarea id="decrypt-input" rows="8" placeholder="Message chiffré reçu" spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <button id="decrypt-btn" class="primary-btn">Déchiffrer le message</button>
                </div>

                <div class="section">
                    <textarea id="decrypt-output" rows="8" readonly placeholder="Message déchiffré"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Inputs cachés pour la sélection de fichiers -->
    <input type="file" id="file-input-my-public" accept=".txt,.key" style="display: none;">
    <input type="file" id="file-input-my-private" accept=".txt,.key" style="display: none;">
    <input type="file" id="file-input-interlocutor" accept=".txt,.key" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
