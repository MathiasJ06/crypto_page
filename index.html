<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffr</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chiffr</h1>

        <div class="loading" id="loading">
            <p>Chargement...</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <div class="content" id="content" style="display: none;">
            <!-- Onglets -->
            <div class="tabs">
                <button class="tab-button active" data-tab="keys">🔑 Gestion des clés</button>
                <button class="tab-button" data-tab="encrypt">🔒 Chiffrement</button>
                <button class="tab-button" data-tab="decrypt">🔓 Déchiffrement</button>
            </div>

            <!-- Onglet Gestion des clés -->
            <div class="tab-content active" id="keys-tab">
                <div class="section">
                    <h3>Ma paire de clés RSA</h3>
                    <div class="my-keys-section">
                        <div class="key-prefix-input">
                            <input type="text" id="key-prefix" placeholder="Préfixe des clés (ex: mon_nom)" />
                        </div>
                        <button id="generate-rsa-keys-btn">Générer ma paire RSA</button>
                    </div>
                    <div class="key-status">
                        <div class="key-status-item">
                            <span>Clé publique : </span>
                            <span id="public-key-status">❌ Non chargée</span>
                        </div>
                        <div class="key-status-item">
                            <span>Clé privée : </span>
                            <span id="private-key-status">❌ Non chargée</span>
                        </div>
                    </div>
                    <div class="key-buttons">
                        <button id="download-my-public-key-btn">Télécharger clé publique</button>
                        <button id="download-my-private-key-btn">Télécharger clé privée</button>
                        <button id="load-my-public-key-btn">Charger clé publique</button>
                        <button id="load-my-private-key-btn">Charger clé privée</button>
                        <button id="clear-keys-btn">Effacer les clés</button>
                    </div>
                </div>

                <div class="section">
                    <h3>Clés publiques des interlocuteurs</h3>
                    <div class="contacts-section">
                        <div class="contact-input">
                            <input type="text" id="contact-name" placeholder="Nom de l'interlocuteur" />
                            <textarea id="contact-public-key-input" rows="2" placeholder="Clé publique de l'interlocuteur"></textarea>
                            <div class="contact-buttons">
                                <button id="add-contact-btn">Ajouter</button>
                                <button id="load-contact-key-btn">Charger depuis fichier</button>
                            </div>
                        </div>
                        <div class="contacts-list" id="contacts-list">
                            <!-- Les contacts seront ajoutés ici dynamiquement -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Onglet Chiffrement -->
            <div class="tab-content" id="encrypt-tab">
                <div class="section">
                    <h3>Sélectionner l'interlocuteur</h3>
                    <select id="encrypt-contact-select">
                        <option value="">-- Sélectionner un interlocuteur --</option>
                    </select>
                </div>

                <div class="section">
                    <textarea id="encrypt-input" rows="8" placeholder="Texte à chiffrer" spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <button id="encrypt-btn">Chiffrer le message</button>
                </div>

                <div class="section">
                    <textarea id="encrypt-output" rows="8" readonly placeholder="Message chiffré (à envoyer)"></textarea>
                </div>
            </div>

            <!-- Onglet Déchiffrement -->
            <div class="tab-content" id="decrypt-tab">
                <div class="section">
                    <textarea id="decrypt-input" rows="8" placeholder="Message chiffré reçu" spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <button id="decrypt-btn">Déchiffrer le message</button>
                </div>

                <div class="section">
                    <textarea id="decrypt-output" rows="8" readonly placeholder="Message déchiffré"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Inputs cachés pour la sélection de fichiers -->
    <input type="file" id="file-input-my-public" accept=".txt,.key" style="display: none;">
    <input type="file" id="file-input-my-private" accept=".txt,.key" style="display: none;">
    <input type="file" id="file-input-contact" accept=".txt,.key" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
