<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil Fernet - Chiffrage/Déchiffrage</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Outil Fernet</h1>
        <p class="subtitle">Chiffrez et déchiffrez vos messages avec Pyodide</p>

        <div class="loading" id="loading">
            <p>Chargement de Pyodide et des dépendances Python...</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <div class="content" id="content" style="display: none;">
            <!-- Onglets -->
            <div class="tabs">
                <button class="tab-button active" data-tab="encrypt">Chiffrage</button>
                <button class="tab-button" data-tab="decrypt">Déchiffrage</button>
            </div>

            <!-- Contenu des onglets -->
            <div class="tab-content active" id="encrypt-tab">
                <div class="section">
                    <h2>🔑 Clé Fernet</h2>
                    <div class="key-section">
                        <textarea id="encrypt-key" rows="2" placeholder="Collez votre clé Fernet ici ou générez-en une..."></textarea>
                        <div class="key-buttons">
                            <button id="generate-key-btn">Générer une clé</button>
                            <button id="clear-key-btn">Effacer</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>📝 Texte à chiffrer</h2>
                    <textarea id="encrypt-input" rows="6" placeholder="Saisissez votre texte ici..." spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <h2>🔒 Résultat chiffré</h2>
                    <textarea id="encrypt-output" rows="6" readonly placeholder="Le texte chiffré apparaîtra ici..."></textarea>
                </div>
            </div>

            <div class="tab-content" id="decrypt-tab">
                <div class="section">
                    <h2>🔑 Clé Fernet</h2>
                    <div class="key-section">
                        <textarea id="decrypt-key" rows="2" placeholder="Collez votre clé Fernet ici..."></textarea>
                        <div class="key-buttons">
                            <button id="clear-decrypt-key-btn">Effacer</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>📝 Texte à déchiffrer</h2>
                    <textarea id="decrypt-input" rows="6" placeholder="Collez votre texte chiffré ici..." spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <h2>🔓 Résultat déchiffré</h2>
                    <textarea id="decrypt-output" rows="6" readonly placeholder="Le texte déchiffré apparaîtra ici..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
