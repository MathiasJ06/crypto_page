<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernet</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Fernet</h1>

        <div class="loading" id="loading">
            <p>Chargement...</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <div class="content" id="content" style="display: none;">
            <!-- Onglets -->
            <div class="tabs">
                <button class="tab-button active" data-tab="encrypt">Chiffrage</button>
                <button class="tab-button" data-tab="decrypt">Déchiffrage</button>
            </div>

            <!-- Contenu des onglets -->
            <div class="tab-content active" id="encrypt-tab">
                <div class="section">
                    <div class="key-section">
                        <textarea id="encrypt-key" rows="2" placeholder="Clé Fernet (masquée)" readonly></textarea>
                        <div class="key-buttons">
                            <button id="generate-key-btn">Générer</button>
                            <button id="clear-key-btn">Effacer</button>
                            <button id="download-encrypt-key-btn">Télécharger</button>
                            <button id="load-encrypt-key-btn">Charger</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <textarea id="encrypt-input" rows="8" placeholder="Texte à chiffrer" spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <textarea id="encrypt-output" rows="8" readonly placeholder="Résultat"></textarea>
                </div>
            </div>

            <div class="tab-content" id="decrypt-tab">
                <div class="section">
                    <div class="key-section">
                        <textarea id="decrypt-key" rows="2" placeholder="Clé Fernet (masquée)" readonly></textarea>
                        <div class="key-buttons">
                            <button id="clear-decrypt-key-btn">Effacer</button>
                            <button id="download-decrypt-key-btn">Télécharger</button>
                            <button id="load-decrypt-key-btn">Charger</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <textarea id="decrypt-input" rows="8" placeholder="Texte à déchiffrer" spellcheck="false"></textarea>
                </div>

                <div class="section">
                    <textarea id="decrypt-output" rows="8" readonly placeholder="Résultat"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Input caché pour la sélection de fichier -->
    <input type="file" id="file-input" accept=".txt,.key" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
